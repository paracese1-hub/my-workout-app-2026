<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 운동 앱</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182235;font-family:system-ui,sans-serif;padding-bottom:75px}header{background:#172b4d;color:white;padding:20px}main{max-width:700px;margin:auto;padding:14px}.card{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:15px;margin:12px 0}button{border:0;border-radius:9px;padding:10px 13px;background:#315b9a;color:white;font-weight:700;margin:3px}button.alt{background:#eaf0f8;color:#243b5d}nav{position:fixed;bottom:0;background:white;width:100%;display:flex;justify-content:space-around;padding:9px 0;border-top:1px solid #ddd}nav button{background:none;color:#345}input,select,textarea{padding:10px;border:1px solid #ccd5e2;border-radius:8px;font:inherit;width:100%;margin:4px 0}label{font-size:12px;color:#667}small{color:#667}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#667;font-size:13px}.set{display:grid;grid-template-columns:35px 1fr 1fr 55px;gap:5px;align-items:center;margin:7px 0}.musclegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bodymap{width:100%;max-width:220px;margin:auto;display:block}.muscle{stroke:#fff;stroke-width:2}.legend{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:#667}.swatch{width:13px;height:13px;border-radius:3px;display:inline-block}
</style>
<header><b>내 운동 앱</b><div class="muted" style="color:#d5deeb">홈트와 헬스장 운동을 따로 관리</div></header><main id="app"></main>
<nav><button onclick="tab='home';draw()">홈</button><button onclick="tab='routine';draw()">내 루틴</button><button onclick="tab='work';draw()">운동하기</button><button onclick="tab='records';draw()">기록</button><button onclick="tab='body';draw()">몸 관리</button><button onclick="tab='muscle';draw()">근육 지도</button></nav>
<script>
const KEY='myWorkoutAppFreshV1';
const base={mode:'home',routines:[],sessions:[],body:[],ex:{
home:[['덤벨 벤치프레스','가슴'],['인클라인 덤벨프레스','가슴'],['원암 덤벨로우','등'],['덤벨 스쿼트','하체'],['덤벨 루마니안 데드리프트','하체'],['덤벨 숄더프레스','어깨'],['사이드 레터럴 레이즈','어깨'],['덤벨 컬','팔'],['오버헤드 트라이셉스 익스텐션','팔'],['크런치','복근']],
gym:[['바벨 벤치프레스','가슴'],['케이블 플라이','가슴'],['랫풀다운','등'],['시티드 케이블로우','등'],['레그프레스','하체'],['레그컬','하체'],['머신 숄더프레스','어깨'],['케이블 푸시다운','팔']]}};
let d;try{d={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{d=structuredClone(base)}
let tab='home',session=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(d));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mode(m){d.mode=m;save();draw()}
function draw(){let a=document.getElementById('app'),rs=d.routines.filter(x=>x.mode===d.mode);
if(tab==='home')a.innerHTML=`<div class="card"><h2>오늘 운동</h2><p class="muted">현재 모드: ${d.mode==='home'?'홈트':'헬스장'}</p><button onclick="mode('home')">홈트</button><button onclick="mode('gym')">헬스장</button><p>누적 운동 ${d.sessions.length}회 · 저장 루틴 ${rs.length}개</p><p class="muted">홈트 장비: 조절식 덤벨 2개(각 25kg), 조절식 벤치</p><button onclick="tab='work';draw()">운동 시작</button></div>`;
if(tab==='routine')a.innerHTML=`<h2>내 루틴 · ${d.mode==='home'?'홈트':'헬스장'}</h2><button onclick="mode('home')">홈트</button><button onclick="mode('gym')">헬스장</button><button onclick="makeRoutine()">＋ 루틴 만들기</button>${rs.map(r=>`<div class="card"><b>${esc(r.name)}</b><p class="muted">${r.items.map(x=>esc(x.name)+' '+x.sets+'세트×'+x.reps+'회').join('<br>')}</p><button onclick="start('${r.id}')">시작</button><button class="alt" onclick="edit('${r.id}')">수정</button><button class="alt" onclick="del('${r.id}')">삭제</button></div>`).join('')||'<div class="card">저장된 루틴이 없습니다.</div>'}`;
if(tab==='work')a.innerHTML=session?`<h2>${esc(session.name)}</h2>${session.items.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b>${x.setsData.map((s,j)=>`<div class="set">${j+1}세트<input type="number" value="${s.w}" placeholder="kg" onchange="session.items[${i}].setsData[${j}].w=+this.value"><input type="number" value="${s.r}" placeholder="회" onchange="session.items[${i}].setsData[${j}].r=+this.value"><input type="checkbox" ${s.done?'checked':''} onchange="session.items[${i}].setsData[${j}].done=this.checked"></div>`).join('')}<button class="alt" onclick="addSet(${i})">세트 추가</button></div>`).join('')}<div class="card"><textarea id="memo" placeholder="운동 메모"></textarea><button onclick="finish()">기록 저장</button></div>`:`<h2>운동하기</h2><div class="card"><button onclick="mode('home')">홈트</button><button onclick="mode('gym')">헬스장</button><h3>저장 루틴</h3><select id="sel"><option value="">루틴 선택</option>${rs.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button onclick="let r=d.routines.find(x=>x.id===sel.value);if(r)start(r.id);else alert('루틴을 선택하세요')">선택 루틴 시작</button><hr><h3>운동 직접 구성</h3>${d.ex[d.mode].map((x,i)=>`<label><input type="checkbox" class="pick" value="${i}"> ${esc(x[0])}</label>`).join('')}<button onclick="freeStart()">선택 운동 시작</button></div>`;
if(tab==='records')a.innerHTML=`<h2>운동 기록</h2>${d.sessions.slice().reverse().map(s=>`<div class="card"><b>${esc(s.name)}</b><p class="muted">${s.date} · ${s.items.map(x=>esc(x.name)).join(', ')}</p>${s.items.map(x=>`<small>${esc(x.name)}: ${x.setsData.map(y=>y.w+'kg×'+y.r+(y.done?' ✓':'')).join(' / ')}</small><br>`).join('')}</div>`).join('')||'<div class="card">아직 기록이 없습니다.</div>'}<div class="card"><button onclick="backup()">백업 파일 저장</button><label>백업 불러오기<input type="file" accept="application/json" onchange="restore(event)"></label></div>`;
if(tab==='muscle')a.innerHTML=muscleView();
if(tab==='body')a.innerHTML=`<h2>몸 관리</h2><div class="card"><label>측정일</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><label>체중(kg)</label><input id="weight" type="number" step=".1"><label>허리둘레(cm, 선택)</label><input id="waist" type="number" step=".1"><button onclick="bodySave()">측정 저장</button></div><div class="card"><h3>측정 기록</h3>${d.body.map(x=>`<p>${x.date} · ${x.weight}kg · ${x.waist||'-'}cm</p>`).join('')||'기록이 없습니다.'}</div>`;
}
function makeRoutine(old){let name=prompt('루틴 이름',old?.name||'새 루틴');if(name===null)return;let list=d.ex[d.mode],nums=prompt('운동 번호를 쉼표로 입력\n'+list.map((x,i)=>(i+1)+'. '+x[0]).join('\n'),old?old.items.map(x=>list.findIndex(y=>y[0]===x.name)+1).join(','):'');if(nums===null)return;let items=nums.split(',').map(n=>list[+n.trim()-1]).filter(Boolean).map(x=>{let p=old?.items.find(y=>y.name===x[0]);return {name:x[0],group:x[1],sets:+(prompt(x[0]+' 세트 수',p?.sets||3)||3),reps:+(prompt(x[0]+' 반복 수',p?.reps||10)||10)}});if(!items.length)return alert('운동을 선택하세요');let r={id:old?.id||crypto.randomUUID(),name,mode:d.mode,items};d.routines=old?d.routines.map(x=>x.id===r.id?r:x):[...d.routines,r];save();draw()}
function edit(id){makeRoutine(d.routines.find(x=>x.id===id))}function del(id){if(confirm('루틴을 삭제할까요?')){d.routines=d.routines.filter(x=>x.id!==id);save();draw()}}
function start(id){let r=d.routines.find(x=>x.id===id);session={name:r.name,items:r.items.map(x=>({...x,setsData:Array.from({length:x.sets},()=>({w:0,r:x.reps,done:false}))}))};tab='work';draw()}
function freeStart(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>+x.value);if(!ids.length)return alert('운동을 선택하세요');session={name:'자유 운동',items:ids.map(i=>{let x=d.ex[d.mode][i];return {name:x[0],group:x[1],setsData:Array.from({length:3},()=>({w:0,r:10,done:false}))}})};draw()}
function addSet(i){session.items[i].setsData.push({w:0,r:10,done:false});draw()}
function finish(){d.sessions.push({date:new Date().toISOString().slice(0,10),mode:d.mode,name:session.name,items:session.items,memo:document.getElementById('memo').value});session=null;save();tab='records';draw();alert('운동 기록을 저장했습니다.')}

function weekStart(){
let n=new Date(),day=(n.getDay()+6)%7;n.setDate(n.getDate()-day);
return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`
}
function muscleView(){
let start=weekStart(),groups={가슴:0,등:0,어깨:0,팔:0,하체:0,복근:0};
d.sessions.filter(s=>s.date>=start).forEach(s=>s.items.forEach(it=>{let v=(it.setsData||[]).reduce((a,x)=>a+(Number(x.w)||0)*(Number(x.r)||0),0);groups[it.group]=(groups[it.group]||0)+Math.max(v,(it.setsData||[]).filter(x=>x.done).length*10)}));
let max=Math.max(1,...Object.values(groups));
let color=g=>{let v=groups[g]||0;if(!v)return '#e8ebef';let n=v/max;return n>.75?'#ad263d':n>.45?'#d34b60':n>.2?'#eb929c':'#f6c4ca'};
const shape=(back)=>{
const skin=`<defs>
<linearGradient id="skin${back?'r':'f'}" x1="0" x2="1"><stop stop-color="#cbd2dc"/><stop offset=".22" stop-color="#f4f6f8"/><stop offset=".52" stop-color="#fff"/><stop offset=".82" stop-color="#e7ebf0"/><stop offset="1" stop-color="#c5ccd6"/></linearGradient>
<linearGradient id="muscle${back?'r':'f'}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#7b8796" stop-opacity=".18"/></linearGradient>
<filter id="shadow${back?'r':'f'}" x="-20%" y="-10%" width="140%" height="130%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>`;
const outline=`<g fill="url(#skin${back?'r':'f'})" stroke="#c4ccd7" stroke-width="1.5" stroke-linejoin="round">
<circle cx="100" cy="24" r="18"/><path d="M91 40 L89 48 Q78 51 70 57 L54 61 Q43 65 37 79 L25 128 Q22 139 31 143 L39 139 L48 105 L43 163 Q42 178 53 188 L63 196 L66 231 L58 275 Q55 294 61 310 L67 315 L77 312 L82 277 L87 244 L100 248 L113 244 L118 277 L123 312 L133 315 L139 310 Q145 294 142 275 L134 231 L137 196 L147 188 Q158 178 157 163 L152 105 L161 139 L169 143 Q178 139 175 128 L163 79 Q157 65 146 61 L130 57 Q122 51 111 48 L109 40 Q100 44 91 40Z"/>
<path d="M66 310 Q81 315 96 313 L94 361 Q92 391 84 416 L73 422 L62 417 Q59 402 61 383Z M104 313 Q119 315 134 310 L139 383 Q141 402 138 417 L127 422 L116 416 Q108 391 106 361Z"/>
</g><path d="M91 41 Q100 46 109 41" fill="none" stroke="#c4ccd7" stroke-width="1.2"/>`;
const front=`<g stroke="#fff" stroke-width="1.35" stroke-linejoin="round">
<!-- shoulders -->
<path fill="${color('어깨')}" d="M55 66 Q64 56 79 58 Q86 65 82 80 Q75 93 61 96 Q49 91 48 80Z"/><path fill="${color('어깨')}" d="M145 66 Q136 56 121 58 Q114 65 118 80 Q125 93 139 96 Q151 91 152 80Z"/>
<!-- chest -->
<path fill="${color('가슴')}" d="M79 75 Q90 68 99 75 L98 108 Q89 116 73 110 Q62 105 65 91 Q69 80 79 75Z"/><path fill="${color('가슴')}" d="M121 75 Q110 68 101 75 L102 108 Q111 116 127 110 Q138 105 135 91 Q131 80 121 75Z"/>
<!-- biceps -->
<path fill="${color('팔')}" d="M48 91 Q57 86 64 96 L59 126 Q55 139 47 151 L39 145 L42 116Z"/><path fill="${color('팔')}" d="M152 91 Q143 86 136 96 L141 126 Q145 139 153 151 L161 145 L158 116Z"/>
<!-- forearms -->
<path fill="${color('팔')}" d="M39 146 Q47 142 54 150 L49 180 Q45 193 38 195 L31 185Z"/><path fill="${color('팔')}" d="M161 146 Q153 142 146 150 L151 180 Q155 193 162 195 L169 185Z"/>
<!-- abs -->
<path fill="${color('복근')}" d="M84 115 Q100 119 116 115 L115 132 Q100 136 85 132Z M84 135 Q100 139 116 135 L115 151 Q100 155 85 151Z M84 154 Q100 158 116 154 L115 170 Q100 174 85 170Z M85 173 Q100 177 115 173 L113 187 Q100 191 87 187Z"/>
<!-- obliques -->
<path fill="${color('복근')}" d="M65 113 Q75 115 83 114 L82 166 Q77 179 67 176 L59 145Z" opacity=".9"/><path fill="${color('복근')}" d="M135 113 Q125 115 117 114 L118 166 Q123 179 133 176 L141 145Z" opacity=".9"/>
<!-- quadriceps -->
<path fill="${color('하체')}" d="M66 198 Q80 193 96 201 L93 246 Q90 274 80 298 Q71 306 64 293 Q59 264 60 231Z"/><path fill="${color('하체')}" d="M134 198 Q120 193 104 201 L107 246 Q110 274 120 298 Q129 306 136 293 Q141 264 140 231Z"/>
<!-- calves -->
<path fill="${color('하체')}" d="M64 315 Q74 319 86 316 L82 373 Q78 393 71 405 L63 400 Q60 382 61 360Z"/><path fill="${color('하체')}" d="M136 315 Q126 319 114 316 L118 373 Q122 393 129 405 L137 400 Q140 382 139 360Z"/>
</g>`;
const rear=`<g stroke="#fff" stroke-width="1.35" stroke-linejoin="round">
<!-- rear delts -->
<path fill="${color('어깨')}" d="M55 66 Q64 56 79 58 Q86 66 81 82 Q73 94 60 95 Q49 90 48 80Z"/><path fill="${color('어깨')}" d="M145 66 Q136 56 121 58 Q114 66 119 82 Q127 94 140 95 Q151 90 152 80Z"/>
<!-- traps -->
<path fill="${color('등')}" d="M88 55 Q100 64 112 55 L128 73 L116 104 L100 116 L84 104 L72 73Z"/>
<!-- lats -->
<path fill="${color('등')}" d="M72 94 Q83 100 94 107 L91 164 Q83 179 69 169 L59 132Z"/><path fill="${color('등')}" d="M128 94 Q117 100 106 107 L109 164 Q117 179 131 169 L141 132Z"/>
<!-- lower back -->
<path fill="${color('등')}" d="M94 112 L106 112 L111 184 Q100 193 89 184Z"/>
<!-- triceps -->
<path fill="${color('팔')}" d="M48 91 Q57 86 64 96 L59 126 Q55 139 47 151 L39 145 L42 116Z"/><path fill="${color('팔')}" d="M152 91 Q143 86 136 96 L141 126 Q145 139 153 151 L161 145 L158 116Z"/>
<!-- forearms -->
<path fill="${color('팔')}" d="M39 146 Q47 142 54 150 L49 180 Q45 193 38 195 L31 185Z"/><path fill="${color('팔')}" d="M161 146 Q153 142 146 150 L151 180 Q155 193 162 195 L169 185Z"/>
<!-- glutes -->
<path fill="${color('하체')}" d="M65 193 Q81 187 98 199 L96 226 Q88 241 73 236 Q61 227 60 211Z"/><path fill="${color('하체')}" d="M135 193 Q119 187 102 199 L104 226 Q112 241 127 236 Q139 227 140 211Z"/>
<!-- hamstrings -->
<path fill="${color('하체')}" d="M66 237 Q80 242 95 232 L91 292 Q83 309 72 303 Q62 285 62 264Z"/><path fill="${color('하체')}" d="M134 237 Q120 242 105 232 L109 292 Q117 309 128 303 Q138 285 138 264Z"/>
<!-- calves -->
<path fill="${color('하체')}" d="M64 315 Q74 319 86 316 L82 373 Q78 393 71 405 L63 400 Q60 382 61 360Z"/><path fill="${color('하체')}" d="M136 315 Q126 319 114 316 L118 373 Q122 393 129 405 L137 400 Q140 382 139 360Z"/>
</g>`;
return `<svg class="bodymap" viewBox="0 0 200 430" role="img" aria-label="${back?'후면':'전면'} 근육도">${skin}${outline}${back?rear:front}<path d="M100 49 L100 190" stroke="#aeb8c5" stroke-width=".8" opacity=".45"/></svg>`;
};
return `<h2>주간 근육 사용량</h2><div class="card"><b>이번 주</b> <span class="muted">월요일부터 현재까지 · ${start} 시작</span><p class="muted">운동 기록을 바탕으로 계산한 참고용 사용량이며, 실제 근육 성장 정도를 뜻하지 않습니다.</p><div class="musclegrid"><div><h3>정면</h3>${shape(false)}</div><div><h3>후면</h3>${shape(true)}</div></div><div class="legend"><span class="swatch" style="background:#e8ebef"></span>기록 없음 <span class="swatch" style="background:#f6c4ca"></span>낮음 <span class="swatch" style="background:#eb929c"></span>보통 <span class="swatch" style="background:#d34b60"></span>높음 <span class="swatch" style="background:#ad263d"></span>매우 높음</div></div><div class="card"><h3>부위별 이번 주 기록량</h3>${Object.entries(groups).map(([g,v])=>`<p class="between"><span>${g}</span><b>${Math.round(v).toLocaleString()} 점</b></p><div style="height:7px;background:#eee;border-radius:8px;margin-bottom:10px"><i style="display:block;height:7px;border-radius:8px;background:${color(g)};width:${v?Math.max(4,v/max*100):0}%"></i></div>`).join('')}<small>매주 월요일 기준으로 화면이 새로 집계됩니다. 과거 운동 기록은 삭제되지 않습니다.</small></div>`
}
function bodySave(){let w=+weight.value;if(!w)return alert('체중을 입력하세요');d.body.push({date:date.value,weight:w,waist:+waist.value||null});save();draw()}
function backup(){let b=new Blob([JSON.stringify(d)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='my-workout-backup.json';a.click();URL.revokeObjectURL(u)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.sessions||!x.routines||!x.ex)throw 0;if(confirm('현재 새 앱 데이터를 백업 내용으로 교체할까요?')){d=x;save();draw()}}catch{alert('올바른 백업 파일이 아닙니다')}};r.readAsText(f)}
draw();
</script></main></html>
